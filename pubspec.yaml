name: polar_go
description: Polar Go - Open-source privacy-focused web browser with multi-tab support, Speed Dial, tracker blocking, and auto-clear history on close.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/polar_go_icon.png"
  adaptive_icon_background: "#1E40AF"
  adaptive_icon_foreground: "assets/icon/polar_go_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/polar_go_icon.png
